<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Pedidos — Demonstração | Prompt Soluções</title><meta name="description" content="Protótipo interativo de cardápio digital e gerenciamento de pedidos da Prompt Soluções. Demonstração sem vendas reais."><meta property="og:title" content="Prompt Pedidos — Demonstração interativa"><meta property="og:description" content="Conheça o protótipo da Prompt Soluções: cardápio digital e painel do comerciante. Nenhuma venda real."><meta property="og:type" content="website"><style>
:root{--bg:#f5f4f8;--ink:#242136;--muted:#716d80;--purple:#6341ba;--dark:#201a35;--line:#e6e2ee;--green:#167b56}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9c8be0;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,40px);line-height:1.12;letter-spacing:-1.2px}h2{font-size:22px;letter-spacing:-.5px}h3{font-size:16px}small,.muted{color:var(--muted)}.shell{max-width:1160px;margin:auto;padding:0 22px 42px}.top{background:#201a35;color:white}.topin{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 22px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.5px;font-size:20px}.mark{display:grid;place-items:center;background:#a992ff;color:#201a35;width:36px;height:36px;border-radius:11px;font-size:23px;font-weight:900}.demo{font-size:11px;letter-spacing:1.5px;color:#c8bceb;font-weight:700}.switch{display:flex;gap:4px;background:#352b4c;padding:4px;border-radius:11px}.switch button{padding:9px 12px;border-radius:8px;background:transparent;color:#e4dcef;font-size:13px;font-weight:650}.switch button.active{background:#fff;color:#31234f}.notice{font-size:12px;color:var(--muted);padding:12px 0}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#382263,#724bbd);color:#fff;border-radius:22px;padding:30px;display:flex;justify-content:space-between;align-items:center;min-height:194px;gap:15px}.hero p{color:#e9dfff;margin:10px 0 16px;max-width:450px}.hero-art{font-size:clamp(66px,12vw,140px);transform:rotate(-10deg);filter:drop-shadow(0 12px 12px #26174455);line-height:1}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:750;color:#e2d5ff;margin-bottom:8px}.open{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#256943;border-radius:30px;padding:6px 11px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 13px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin:0 0 13px}.tabs{display:flex;gap:7px;overflow:auto;padding:0 0 13px}.chip{white-space:nowrap;background:white;border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:20px;font-size:13px}.chip.active{background:var(--purple);color:white;border-color:var(--purple)}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product,.panel,.stat,.order{background:white;border:1px solid var(--line);border-radius:15px}.product{display:flex;flex-direction:column;overflow:hidden}.food{display:grid;place-items:center;font-size:66px;height:104px;line-height:1}.food span{filter:drop-shadow(0 6px 5px #0002)}.pbody{padding:13px;display:flex;flex-direction:column;flex:1;gap:5px}.pbody p{font-size:12px;color:var(--muted);min-height:34px}.price-row{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:auto}.price{font-weight:800;color:var(--purple)}.plus{background:#eee8fb;color:var(--purple);font-weight:800;border-radius:10px;padding:8px 12px}.primary{background:var(--purple);color:#fff;font-weight:700;padding:12px 15px;border-radius:10px}.secondary{background:#f1edf9;color:var(--purple);font-weight:700;padding:10px 13px;border-radius:10px}.wide{width:100%}.panel{padding:17px}.cart{position:sticky;top:12px;align-self:start}.empty{text-align:center;color:var(--muted);padding:28px 5px;font-size:14px}.empty .big{font-size:36px;display:block;margin-bottom:6px}.lineitem{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:start}.lineitem small{display:block;font-size:11px}.qty{display:flex;align-items:center;gap:7px;white-space:nowrap}.qty button{width:26px;height:26px;border-radius:7px;background:#f0edf6;color:#574184;font-weight:800}.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-weight:800;font-size:17px}.sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:7px 0}.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}.adminhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 20px;flex-wrap:wrap}.adminhead h1{font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}.stat{padding:14px}.stat small{font-size:12px}.stat strong{display:block;font-size:25px;letter-spacing:-.8px;margin-top:5px}.adminnav{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.lane{background:#eeebf4;padding:10px;border-radius:13px;min-height:175px}.lanehead{display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:13px;margin:3px 0 10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.count{background:white;border-radius:10px;padding:2px 7px;font-size:11px}.order{padding:12px;margin-bottom:8px;font-size:13px}.order h3{font-size:14px}.order p{margin:5px 0}.order .primary,.order .secondary{font-size:11px;padding:8px;margin-top:8px}.order small{display:block;font-size:11px;overflow-wrap:anywhere}.catalogrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.catalogrow:last-child{border:0}.thumb{width:50px;height:50px;display:grid;place-items:center;font-size:30px;border-radius:10px}.grow{flex:1}.status{font-size:11px;font-weight:700;background:#e5f5ea;color:var(--green);border-radius:20px;padding:5px 9px}.status.off{background:#f4e7e8;color:#9b3642}.overlay{position:fixed;inset:0;background:#1e1836aa;display:grid;place-items:center;padding:14px;z-index:10}.modal{width:min(100%,470px);max-height:92dvh;overflow:auto;background:#fff;border-radius:19px;padding:22px;box-shadow:0 20px 70px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}.close{background:#f1eef5;color:#4b405d;border-radius:50%;width:33px;height:33px;flex:none;font-size:21px}.field{display:block;margin:12px 0;font-size:13px;font-weight:650}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.choice{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;font-size:13px}.choice input{accent-color:var(--purple)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#241b38;color:#fff;padding:12px 19px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0003;width:max-content;max-width:90%;font-size:13px}.success{text-align:center;padding:12px 0}.success .big{font-size:50px}.progress{display:flex;gap:5px;margin:14px 0}.progress div{flex:1;background:#e9e5f0;height:6px;border-radius:8px}.progress div.done{background:var(--purple)}.tracking{margin-top:14px;border-left:4px solid var(--purple)}.tracking h3{margin-bottom:5px}.mobilecart{display:none}.error{color:#a52d48;font-size:12px;margin:6px 0}.hide{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.cart{position:static}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.mobilecart{display:block;position:sticky;bottom:8px;z-index:3;margin-top:13px;box-shadow:0 5px 25px #32205b44}}@media(max-width:440px){.shell{padding:0 12px 35px}.topin{padding:12px}.topin .switch{width:100%}.switch button{flex:1}.hero{padding:22px 17px;min-height:155px}.hero-art{font-size:63px}.hero p{font-size:12px}.products{gap:8px}.pbody{padding:10px}.food{height:86px;font-size:54px}.pbody h3{font-size:14px}.pbody p{font-size:11px}.price{font-size:13px}.board{grid-template-columns:1fr}.stat strong{font-size:22px}}
</style></head><body><header class="top"><div class="topin"><div class="brand"><span class="mark">P</span><div>Prompt Pedidos<div class="demo">PROTÓTIPO INTERATIVO</div></div></div><nav class="switch" aria-label="Ambiente"><button id="customerTab" class="active" onclick="view('customer')">🛍 Cliente</button><button id="adminTab" onclick="view('admin')">▦ Comerciante</button></nav></div></header><main class="shell"><p class="notice">Demonstração da Prompt Soluções • Loja fictícia • Nenhum pedido ou pagamento real. Use somente dados fictícios.</p><div id="app"></div></main><div id="modalRoot"></div><div id="toast" class="toast hide" role="status"></div>
<script>
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const products=[{id:1,name:'Açaí clássico',cat:'Açaí',desc:'Açaí cremoso com banana e granola.',price:15.9,emoji:'🫐',bg:'#e7dbf9'},{id:2,name:'Açaí premium',cat:'Açaí',desc:'Açaí com morango, leite em pó e creme.',price:22.9,emoji:'🍓',bg:'#f6dce7'},{id:3,name:'Sorvete de chocolate',cat:'Sorvetes',desc:'Duas bolas de sorvete de chocolate.',price:12,emoji:'🍨',bg:'#f0dfcf'},{id:4,name:'Casquinha mista',cat:'Sorvetes',desc:'Baunilha e chocolate na casquinha crocante.',price:6.5,emoji:'🍦',bg:'#f8edcc'},{id:5,name:'Milk-shake de morango',cat:'Milk-shakes',desc:'Milk-shake cremoso de morango, 400 ml.',price:18,emoji:'🥤',bg:'#f9dfe5'},{id:6,name:'Sundae especial',cat:'Sorvetes',desc:'Sorvete, calda e cobertura crocante.',price:14.9,emoji:'🍧',bg:'#dceff0'}];
const stages=['Recebido','Em preparo','Pronto / em entrega','Concluído'];const colors=['#7655c5','#d88a28','#3076bc','#18845c'];let cart=[],orders=[],unavailable=[],mode='customer',category='Todos',query='',adminSection='Pedidos',tracked=null,seq=101,toastTimer;const root=document.getElementById('app');
function view(m){mode=m;document.getElementById('customerTab').classList.toggle('active',m==='customer');document.getElementById('adminTab').classList.toggle('active',m==='admin');render();window.scrollTo(0,0)}function render(){mode==='customer'?customer():admin()}
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),2500)}function subtotal(){return cart.reduce((s,i)=>s+i.unit*i.qty,0)}function items(){return cart.reduce((s,i)=>s+i.qty,0)}
function customer(){const last=orders.find(o=>o.id===tracked);root.innerHTML=`<section class="hero"><div><div class="eyebrow">LOJA DEMONSTRAÇÃO</div><h1>Estação Gelada</h1><p>Açaí, sorvetes e momentos deliciosos. Faça seu pedido em poucos cliques.</p><span class="open">● Aberto • Entrega ou retirada</span></div><div class="hero-art" aria-hidden="true">🍨</div></section>${last?`<section class="panel tracking"><h3>Seu pedido #${last.id} — ${esc(last.stage===2?(last.delivery?'Saiu para entrega':'Pronto para retirada'):stages[last.stage])}</h3><div class="progress">${stages.map((_,i)=>`<div class="${i<=last.stage?'done':''}"></div>`).join('')}</div><small>${last.stage===3?'Pedido finalizado! Obrigado pela preferência.':'O status muda conforme o comerciante atualiza o pedido.'}</small></section>`:''}<div class="layout"><section><div class="section-head"><h2>Cardápio</h2><small>Feito para você</small></div><input class="search" aria-label="Pesquisar produtos" placeholder="⌕  O que você quer pedir?" value="${esc(query)}" oninput="query=this.value;drawProducts()"><div class="tabs">${['Todos','Açaí','Sorvetes','Milk-shakes'].map(c=>`<button class="chip ${c===category?'active':''}" onclick="category='${c}';customer()">${c}</button>`).join('')}</div><div class="products" id="products"></div><button class="primary wide mobilecart ${cart.length?'':'hide'}" onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">Ver sacola (${items()}) • ${money(subtotal())}</button></section><aside class="panel cart" id="cart"></aside></div>`;drawProducts();drawCart()}
function drawProducts(){const p=products.filter(x=>(category==='Todos'||x.cat===category)&&(`${x.name} ${x.desc}`).toLowerCase().includes(query.toLowerCase()));document.getElementById('products').innerHTML=p.length?p.map(x=>`<article class="product"><div class="food" style="background:${x.bg}"><span>${x.emoji}</span></div><div class="pbody"><h3>${x.name}</h3><p>${x.desc}</p><div class="price-row"><span class="price">${money(x.price)}</span><button class="plus" ${unavailable.includes(x.id)?'disabled':''} onclick="customize(${x.id})">${unavailable.includes(x.id)?'Esgotado':'+ Pedir'}</button></div></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}
function drawCart(){document.getElementById('cart').innerHTML=`<div class="section-head"><h2>Minha sacola</h2><span class="status">${items()} itens</span></div>${cart.length?cart.map((i,k)=>`<div class="lineitem"><div><strong>${esc(i.name)}</strong><small>${esc(i.details)}</small><small>${money(i.unit*i.qty)}</small></div><div class="qty"><button aria-label="Diminuir" onclick="changeQty(${k},-1)">−</button>${i.qty}<button aria-label="Aumentar" onclick="changeQty(${k},1)">+</button></div></div>`).join(''):'<div class="empty"><span class="big">🛍️</span>Sua sacola está vazia.<br>Escolha algo delicioso!</div>'}<div class="total"><span>Subtotal</span><span>${money(subtotal())}</span></div><button class="primary wide" ${cart.length?'':'disabled'} onclick="checkout()">Finalizar pedido</button><p class="foot">Taxa de entrega calculada na finalização.</p>`}
function changeQty(k,n){cart[k].qty+=n;if(cart[k].qty<=0)cart.splice(k,1);customer()}
function modal(title,content){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${title}</h2><button class="close" aria-label="Fechar" onclick="closeModal()">×</button></div>${content}</section></div>`;document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function customize(id){const p=products.find(x=>x.id===id);modal(p.name,`<div class="food" style="background:${p.bg};border-radius:12px">${p.emoji}</div><p class="muted" style="margin-top:10px">${p.desc}</p><form id="customForm" onchange="customPrice(${id})" onsubmit="addItem(event,${id})"><label class="field">Tamanho<select name="size"><option value="0">Padrão — ${money(p.price)}</option><option value="5">Grande — + R$ 5,00</option></select></label><strong>Adicionais opcionais</strong>${[['Calda',2],['Leite em pó',3],['Granola',2.5]].map(([n,v])=>`<label class="choice"><span><input type="checkbox" name="extra" value="${v}" data-name="${n}"> ${n}</span>+ ${money(v)}</label>`).join('')}<label class="field">Observação<textarea name="obs" placeholder="Ex.: sem cobertura" rows="2"></textarea></label><button class="primary wide" id="addBtn">Adicionar • ${money(p.price)}</button></form>`)}function customPrice(id){const f=document.getElementById('customForm'),p=products.find(x=>x.id===id);let v=p.price+Number(f.size.value)+[...f.querySelectorAll('input:checked')].reduce((s,e)=>s+Number(e.value),0);document.getElementById('addBtn').textContent='Adicionar • '+money(v);return v}function addItem(e,id){e.preventDefault();const f=e.target,p=products.find(x=>x.id===id),extra=[...f.querySelectorAll('input:checked')].map(e=>e.dataset.name);cart.push({name:p.name,unit:customPrice(id),qty:1,details:[f.size.value==='5'?'Grande':'Padrão',...extra,f.obs.value.trim()].filter(Boolean).join(' · ')});closeModal();customer();notify('Produto adicionado à sacola!')}
function checkout(){if(!cart.length)return;modal('Finalizar pedido',`<form id="checkoutForm" onsubmit="placeOrder(event)"><p class="muted">Use dados fictícios para testar.</p><label class="field">Nome<input name="customer" placeholder="Cliente Teste" required maxlength="70"></label><label class="field">Recebimento<select name="delivery" onchange="checkoutTotal()"><option value="pickup">Retirada no balcão — grátis</option><option value="delivery">Entrega — R$ 5,00</option></select></label><label class="field hide" id="addr">Endereço fictício<input name="address" placeholder="Rua Exemplo, 123"></label><label class="field">Pagamento (simulado)<select name="payment"><option>Pix</option><option>Cartão na entrega</option><option>Dinheiro</option></select></label><div class="sub"><span>Produtos</span><span>${money(subtotal())}</span></div><div class="sub"><span>Entrega</span><span id="fee">${money(0)}</span></div><div class="total"><span>Total</span><span id="checkoutPrice">${money(subtotal())}</span></div><button class="primary wide">Confirmar pedido de teste</button><p class="foot">Não será feita nenhuma cobrança ou mensagem externa.</p></form>`)}function checkoutTotal(){const f=document.getElementById('checkoutForm'),del=f.delivery.value==='delivery';document.getElementById('addr').classList.toggle('hide',!del);f.address.required=del;document.getElementById('fee').textContent=money(del?5:0);document.getElementById('checkoutPrice').textContent=money(subtotal()+(del?5:0))}function placeOrder(e){e.preventDefault();const f=e.target,del=f.delivery.value==='delivery';const o={id:seq++,customer:f.customer.value.trim()||'Cliente Teste',delivery:del,address:del?f.address.value:'Retirada no balcão',payment:f.payment.value,total:subtotal()+(del?5:0),items:cart.map(x=>({...x})),stage:0,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};orders.unshift(o);tracked=o.id;cart=[];customer();modal('Pedido confirmado!',`<div class="success"><div class="big">✅</div><h2>Pedido #${o.id}</h2><p style="margin:10px 0">Seu pedido de teste foi recebido pela loja.</p><p><strong>${money(o.total)}</strong> • ${esc(o.payment)}</p><p class="muted" style="margin:12px 0">Abra o painel do comerciante para preparar o pedido e acompanhar a mudança de status.</p><button class="primary wide" onclick="closeModal();view('admin')">Ver no painel do comerciante</button><button class="secondary wide" style="margin-top:8px" onclick="closeModal()">Voltar ao cardápio</button></div>`)}
function admin(){let total=orders.reduce((s,o)=>s+o.total,0),done=orders.filter(o=>o.stage===3).length;root.innerHTML=`<div class="adminhead"><div><div class="muted" style="font-size:12px">ESTAÇÃO GELADA / ADMINISTRAÇÃO</div><h1>Painel de controle</h1><p class="muted">Gerencie os pedidos e o cardápio da sua loja.</p></div><button class="secondary" onclick="view('customer')">Abrir cardápio ↗</button></div><section class="stats"><div class="stat"><small>Pedidos recebidos</small><strong>${orders.length}</strong></div><div class="stat"><small>Em andamento</small><strong>${orders.length-done}</strong></div><div class="stat"><small>Concluídos</small><strong>${done}</strong></div><div class="stat"><small>Valor dos pedidos</small><strong>${money(total)}</strong></div></section><div class="adminnav">${['Pedidos','Cardápio'].map(s=>`<button class="chip ${adminSection===s?'active':''}" onclick="adminSection='${s}';admin()">${s}</button>`).join('')}</div>${adminSection==='Pedidos'?`<div class="section-head"><h2>Fila de pedidos</h2><small>${orders.length?'Atualizada nesta sessão':'Faça um pedido no cardápio'}</small></div><section class="board">${stages.map((s,k)=>`<div class="lane"><div class="lanehead"><span><span class="dot" style="background:${colors[k]}"></span>${s}</span><span class="count">${orders.filter(o=>o.stage===k).length}</span></div>${orders.filter(o=>o.stage===k).map(o=>`<article class="order"><div class="section-head" style="margin-bottom:4px"><h3>#${o.id} • ${esc(o.customer)}</h3><small>${o.time}</small></div><small>${o.delivery?'Entrega':'Retirada'} • ${esc(o.payment)}</small>${o.items.map(i=>`<p>${i.qty}× ${esc(i.name)}<small>${esc(i.details)}</small></p>`).join('')}<strong>${money(o.total)}</strong><button class="secondary wide" onclick="orderDetail(${o.id})">Ver detalhes</button>${k<3?`<button class="primary wide" onclick="advance(${o.id})">${k===0?'Aceitar / preparar':k===1?(o.delivery?'Despachar':'Pronto para retirada'):'Concluir pedido'}</button>`:''}</article>`).join('')||'<p class="muted" style="font-size:12px;padding:10px 0">Nenhum pedido</p>'}</div>`).join('')}</section><p class="foot">Para retirada, a terceira etapa indica que o pedido está pronto para retirada.</p>`:`<section class="panel"><div class="section-head"><h2>Produtos da loja</h2><small>${products.length} cadastrados</small></div>${products.map(p=>`<div class="catalogrow"><div class="thumb" style="background:${p.bg}">${p.emoji}</div><div class="grow"><strong>${p.name}</strong><small style="display:block">${p.cat} · ${money(p.price)}</small></div><span class="status ${unavailable.includes(p.id)?'off':''}">${unavailable.includes(p.id)?'Pausado':'Ativo'}</span><button class="secondary" onclick="toggleProduct(${p.id})">${unavailable.includes(p.id)?'Ativar':'Pausar'}</button></div>`).join('')}</section>`}<p class="foot" style="margin-top:20px">Dados de teste mantidos apenas nesta sessão. Atualizar ou fechar a página reinicia o protótipo.</p>`}
function advance(id){const o=orders.find(o=>o.id===id);if(o&&o.stage<3){o.stage++;admin();notify('Status do pedido #'+id+' atualizado.')}}function toggleProduct(id){unavailable=unavailable.includes(id)?unavailable.filter(i=>i!==id):[...unavailable,id];admin();notify('Disponibilidade atualizada.')}function orderDetail(id){const o=orders.find(o=>o.id===id);modal('Pedido #'+id,`<p><strong>${esc(o.customer)}</strong></p><p class="muted">${esc(o.delivery?'Entrega: '+o.address:o.address)} • ${esc(o.payment)}</p>${o.items.map(i=>`<div class="lineitem"><div><strong>${i.qty}× ${esc(i.name)}</strong><small>${esc(i.details)}</small></div><strong>${money(i.qty*i.unit)}</strong></div>`).join('')}<div class="total"><span>Total</span><span>${money(o.total)}</span></div><button class="secondary wide" onclick="closeModal()">Fechar</button>`)}render();
</script></body></html>
